# Phase 5: API + Postgres + Redis + worker scaffold. Frontend remains in later phases.
x-backend-env: &backend-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+psycopg://redcap_app:redcap_app@postgres:5432/redcap_batch_locking
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Override this in deployment so the API and worker share a stable key-cache secret.
  REDCAP_API_KEY_CACHE_SECRET: ${REDCAP_API_KEY_CACHE_SECRET:-local-dev-redcap-api-key-cache-secret}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redcap_batch_locking
      POSTGRES_USER: redcap_app
      POSTGRES_PASSWORD: redcap_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment: *backend-env

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --queues=redcap_jobs
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env

volumes:
  postgres_data:
  redis_data:
