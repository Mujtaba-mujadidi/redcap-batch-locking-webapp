# Phase 6: separate Next.js frontend with FastAPI API + Postgres + Redis + worker.
x-backend-env: &backend-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+psycopg://redcap_app:redcap_app@postgres:5432/redcap_batch_locking
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Override this in deployment so the API and worker share a stable key-cache secret.
  REDCAP_API_KEY_CACHE_SECRET: ${REDCAP_API_KEY_CACHE_SECRET:-local-dev-redcap-api-key-cache-secret}
  TERMINAL_JOB_RETENTION_DAYS: ${TERMINAL_JOB_RETENTION_DAYS:-30}
  MAINTENANCE_CLEANUP_INTERVAL_HOURS: ${MAINTENANCE_CLEANUP_INTERVAL_HOURS:-24}

x-frontend-env: &frontend-env
  BACKEND_ORIGIN: http://api:8000
  NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redcap_batch_locking
      POSTGRES_USER: redcap_app
      POSTGRES_PASSWORD: redcap_app
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment: *backend-env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment: *frontend-env

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --queues=redcap_jobs
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - beat
      - --loglevel=info
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env

volumes:
  postgres_data:
  redis_data:
