<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>REDCap Batch Locking</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #1b2430;
      }
      .card {
        max-width: 28rem;
        padding: 2rem;
        background: #fff;
        border: 1px solid #d7dee7;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #44505f;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>REDCap Batch Locking</h1>
      <p id="status">Starting local services. The Jobs window will open when they are ready.</p>
    </div>
  </body>
</html>
