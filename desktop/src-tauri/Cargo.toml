[package]
name = "redcap_batch_locking_desktop"
version = "0.1.0"
description = "REDCap Batch Locking desktop shell"
authors = ["Oxford REDCap Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
ureq = "2.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
